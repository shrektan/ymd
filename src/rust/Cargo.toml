[package]
name = 'ymd'
publish = false
version = '0.1.7'
edition = '2021'
rust-version = "1.71.0"

[lib]
crate-type = ['rlib', 'staticlib']
name = 'ymd'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
chrono = "0.4.40"
extendr-api = "0.9.0"

[dev-dependencies]
extendr-engine = "0.9.0"
